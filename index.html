
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis Prime // SARAH_OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- MEDIAPIPE NEURAL LINKS (ATOMIC VERSION LOCK) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1632432244/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.6.1629159505/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --hud-primary: #0ea5e9;
            --hud-glow: rgba(14, 165, 233, 0.25);
            --neural-pulse: #8b5cf6;
            --glitch-color: #fb7185;
            --sarah-red: #f43f5e;
            --sarah-cyan: #22d3ee;
            --night-vision: #22c55e;
            --perception-purple: #a855f7;
            --pulse-intensity: 0;
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #000; 
            color: var(--hud-primary);
            margin: 0;
            overflow: hidden;
            /* FORCE CURSOR VISIBILITY */
            cursor: auto !important;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
        }
        
        /* HIDDEN DEFAULT CURSOR - REPLACED BY HAND TRACKER ONLY WHEN ACTIVE */
        .cursor-neural {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--sarah-cyan);
            background-color: rgba(34, 211, 238, 0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 20000;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--sarah-cyan);
            transition: width 0.1s, height 0.1s, background-color 0.1s, opacity 0.3s;
        }
        
        .cursor-neural.pinched {
            width: 10px;
            height: 10px;
            background-color: var(--sarah-cyan);
            border-color: #fff;
            box-shadow: 0 0 25px var(--sarah-cyan);
        }

        /* GAZE CURSOR (EYE TRACKING) */
        .cursor-gaze {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px dashed var(--sarah-red);
            border-radius: 50%;
            pointer-events: none;
            z-index: 19000;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .cursor-gaze::after {
            content: '';
            width: 4px;
            height: 4px;
            background-color: var(--sarah-red);
            border-radius: 50%;
        }

        .cursor-gaze.dwelling {
            border-style: solid;
            border-color: #fff;
            background-color: rgba(244, 63, 94, 0.1);
            animation: dwellPulse 1.5s forwards;
        }
        
        @keyframes dwellPulse {
            0% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: translate(-50%, -50%) scale(0.8); box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
            100% { transform: translate(-50%, -50%) scale(1.2); background-color: rgba(255, 255, 255, 0.8); }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "three": "https://esm.sh/three@^0.182.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="hud-scene">
        <div id="root"></div>
        <!-- Hand Tracker Cursor -->
        <div id="hand-cursor" class="cursor-neural" style="opacity: 0;"></div>
        <!-- Gaze Tracker Cursor -->
        <div id="gaze-cursor" class="cursor-gaze"></div>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
