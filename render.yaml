services:
  - type: web
    name: sovereign-os-web
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SARAH_GATEWAY_MODE
        value: TRUE
      - key: SOVEREIGN_ALLOWED_SUBNETS
        value: "74.220.50.0/24,74.220.58.0/24"
